[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "medbot"
version = "0.1.0"
description = "Evidence-linked medical referral workflow backend"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.19.1",
  "boto3>=1.40,<2",
  "cryptography>=50,<51",
  "fastapi==0.141.1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
  "opentelemetry-instrumentation-fastapi>=0.58b0,<1",
  "opentelemetry-sdk>=1.37,<2",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-ai-slim[openai,google]==2.57.0",
  "pypdfium2==5.14.0",
  "Pillow==13.0.0",
  "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "reportlab>=4.4,<6",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medbot"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires the running local Compose stack"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["medbot"]

[tool.coverage.run]
source = ["medbot"]
